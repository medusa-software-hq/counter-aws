# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install dependencies
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules/.yarn-state.yml
    cmds:
      # Using `--immutable` ensures a clean install based on the lockfile
      - yarn install --immutable

  openapi:
    desc: Generate the API client types from the OpenAPI contract
    deps: [install]
    sources:
      - ../../backend/api/openapi/counter.yaml
    generates:
      - src/gen/api.ts
    cmds:
      - npx openapi-typescript ../../backend/api/openapi/counter.yaml -o src/gen/api.ts

  fmt:check:
    desc: Check package formatting
    deps: [install]
    cmds:
      - npx oxfmt --check "**/*.{ts,tsx,css}"

  fmt:fix:
    desc: Fix package formatting
    deps: [install]
    cmds:
      - npx oxfmt --write "**/*.{ts,tsx,css}"

  lint:
    desc: Lint the package
    deps: [install, openapi]
    cmds:
      - npx oxlint
      - npx stylelint '**/*.css' --cache

  typecheck:
    desc: Type check the package
    deps: [install, openapi]
    cmds:
      - npx tsc --noEmit

  test:
    desc: Run unit tests
    deps: [install, openapi]
    cmds:
      - npx vitest run

  clean:
    desc: Remove generated and build artifacts
    cmds:
      - rm -rf dist src/gen

  build:
    desc: Build the package
    deps: [install, typecheck, openapi]
    cmds:
      - npx vite build

  dev:
    desc: Start dev server
    deps: [install, openapi]
    env:
      VITE_API_URL: http://localhost:8081
    cmds:
      - npx vite
    interactive: true

  preview:
    desc: Start preview server
    deps: [build]
    cmds:
      - npx vite preview
    interactive: true
