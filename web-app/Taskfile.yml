version: '3'

includes:
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

tasks:
  fmt:check:
    desc: Check formatting
    deps: [frontend:fmt:check]

  fmt:fix:
    desc: Fix formatting
    deps: [frontend:fmt:fix]

  lint:
    desc: Lint the app sources
    deps: [frontend:lint]

  analyze:
    desc: Analyze the app sources (frontend typecheck + tests)
    deps: [frontend:typecheck, frontend:test]

  build:
    desc: Build the frontend
    cmds:
      - task: frontend:build

  run:
    desc: Run the frontend dev server
    cmds:
      - task: frontend:dev
