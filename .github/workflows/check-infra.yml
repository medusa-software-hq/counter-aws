name: Check Terraform configuration

on:
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  check-formatting:
    name: Check Terraform formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - uses: terraform-linters/setup-tflint@v6.2.2

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Lint Terraform configuration
        working-directory: infra
        run: tflint --recursive

      # `terraform fmt`/`tflint` are syntactic; only `validate` catches a bad reference or a wrong
      # argument. The two root configurations are checked here because no other workflow does it —
      # `infra/config` has its own (Check config), as do both app foundations.
      - name: Validate Terraform configuration
        run: |
          for root in infra/root/shared infra/root/env-matrix; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done
