name: Deploy API

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "backend/api/**"
      - "backend/infra/foundation/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  id-token: write # assume the CI/CD role via OIDC
  contents: read

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: eu-central-1
      AWS_ROLE_ARN: arn:aws:iam::682544514886:role/counter-aws-github-actions
      JAVA_VERSION: "21"
      TERRAFORM_VERSION: 1.14

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the native custom-runtime zip
        # GraalVM native-image is cross-built in Docker (available on the runner) and packaged as a
        # provided.al2023 `bootstrap` zip that Terraform uploads directly.
        run: ./gradlew :backend:api:handler:buildNativeLambda

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Apply the API foundation
        working-directory: backend/infra/foundation
        env:
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_cognito_issuer_url: ${{ vars.COGNITO_ISSUER_URL }}
          TF_VAR_cognito_spa_client_id: ${{ vars.COGNITO_SPA_CLIENT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
