name: Test staging

# Post-deploy checks that gate promotion to production: called by deploy-api between the staging and
# production phases, so production only proceeds if staging is healthy. Kept to black-box checks over
# the public staging endpoints (no credentials), which is what a promotion gate needs.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Check staging API
    runs-on: ubuntu-latest
    steps:
      - name: Staging API rejects unauthenticated calls
        run: |
          url="https://api.counter-aws-staging.medusa.software/counter/get"
          # The Cognito JWT authorizer must reject an unauthenticated request with 401; any other code
          # means the API is down, misrouted, or the authorizer isn't in front of it. Retry, because
          # the very first staging deploy creates this host and its Cloudflare DNS record from scratch,
          # so it can take a short while to resolve on the runner — a single curl would false-fail.
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || true)
            echo "attempt $attempt: GET $url -> $code"
            [ "$code" = "401" ] && exit 0
            sleep 15
          done
          echo "::error::staging API never returned 401 (last: $code)"
          exit 1
