name: Deploy Web app

# Phased promotion: build + publish the SPA to staging, test staging, then to production. The jobs are
# chained with `needs:`, so a failed staging deploy or test blocks production.
#
# Unlike the API's config-agnostic zip, the SPA bakes its config at build time (VITE_COGNITO_*), so
# each environment builds its own bundle — there is no build-once/promote. `environment:` resolves the
# per-environment Cognito variables, and each foundation applies in its own workspace (`prod` /
# `staging`); the API URL is the same-origin path "/api" in both.

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "web-app/**"
      - "backend/api/openapi/**"
      - ".github/workflows/deploy-web-app.yml"
  workflow_dispatch:

permissions:
  contents: read

# `needs:` only orders jobs inside one run, so two pushes — or a push racing a manual dispatch —
# could otherwise apply the same workspace at the same time.
concurrency:
  group: ${{ github.workflow }}
  # Queue rather than cancel: a run already touching infrastructure should be allowed to finish.
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: ${{ vars.AWS_CICD_ROLE_ARN }}
  NODE_VERSION: "24"
  TERRAFORM_VERSION: 1.14
  FRONTEND_PATH: web-app/frontend

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      web_host: ${{ steps.foundation.outputs.web_host }}
    permissions:
      id-token: write # assume the CI/CD role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/yarn.lock
      - uses: go-task/setup-task@v2
      - name: Build the SPA (staging config)
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_URL: /api
          VITE_COGNITO_AUTHORITY: ${{ vars.COGNITO_ISSUER_URL }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_SPA_CLIENT_ID }}
        # Install first, alone: `task build` runs install/openapi/typecheck as parallel deps, and on a
        # cold node_modules the concurrent yarn processes race and corrupt the install.
        run: |
          yarn install --immutable
          task build
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}
      - name: Apply the web foundation (staging)
        id: foundation
        working-directory: web-app/infra/foundation
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          terraform init -input=false
          terraform workspace select -or-create=true staging
          terraform apply -auto-approve -input=false
          {
            echo "bucket=$(terraform output -raw spa_bucket_name)"
            echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "web_host=$(terraform output -raw web_host)"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the bundle
        env:
          BUCKET: ${{ steps.foundation.outputs.bucket }}
          DISTRIBUTION_ID: ${{ steps.foundation.outputs.distribution_id }}
        run: |
          aws s3 sync "$FRONTEND_PATH/dist" "s3://$BUCKET" --delete
          aws s3 cp "$FRONTEND_PATH/dist/index.html" "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  test-staging:
    name: Test staging
    needs: deploy-staging
    uses: ./.github/workflows/test-staging.yml
    # The web check only makes an anonymous request, but the gate it shares with the API declares the
    # token permission for the API's direct invoke. A called workflow may not hold more than the
    # calling job, and that is settled when the run starts rather than per branch taken -- so a
    # caller that withholds this stops the whole run from starting.
    permissions:
      id-token: write
      contents: read
    with:
      target: web
      host: ${{ needs.deploy-staging.outputs.web_host }}

  deploy-production:
    name: Deploy production
    needs: test-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # assume the CI/CD role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/yarn.lock
      - uses: go-task/setup-task@v2
      - name: Build the SPA (production config)
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_URL: /api
          VITE_COGNITO_AUTHORITY: ${{ vars.COGNITO_ISSUER_URL }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_SPA_CLIENT_ID }}
        run: |
          yarn install --immutable
          task build
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}
      - name: Apply the web foundation (production)
        id: foundation
        working-directory: web-app/infra/foundation
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          terraform init -input=false
          terraform workspace select prod
          terraform apply -auto-approve -input=false
          {
            echo "bucket=$(terraform output -raw spa_bucket_name)"
            echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the bundle
        env:
          BUCKET: ${{ steps.foundation.outputs.bucket }}
          DISTRIBUTION_ID: ${{ steps.foundation.outputs.distribution_id }}
        run: |
          aws s3 sync "$FRONTEND_PATH/dist" "s3://$BUCKET" --delete
          aws s3 cp "$FRONTEND_PATH/dist/index.html" "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
