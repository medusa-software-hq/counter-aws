name: Publish CLI

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "cli/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  publish-cli:
    name: Publish CLI fat jar
    runs-on: ubuntu-latest

    # `environment: production` resolves the COGNITO_* vars + the releases app id to prod's values.
    # The published CLI targets prod; staging is reachable via COUNTER_ENVIRONMENT=staging.
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat jar
        working-directory: cli
        # Bake the Cognito issuer + CLI client id into the jar so the published CLI can sign in. They
        # come from the per-environment COGNITO_* CI variables (the public values the SPA and the API
        # authorizer also consume — no secret involved). The API host is not baked from here: it's
        # author-derived and read from the committed config.json. Staging's vars aren't in this
        # (production) environment, so they bake empty and `COUNTER_ENVIRONMENT=staging ms-counter
        # login` reports that cleanly.
        env:
          COGNITO_ISSUER_URL: ${{ vars.COGNITO_ISSUER_URL }}
          COGNITO_CLI_CLIENT_ID: ${{ vars.COGNITO_CLI_CLIENT_ID }}
        run: |
          ../gradlew :cli:shadowJar
          echo "JAR=$GITHUB_WORKSPACE/cli/build/libs/counter-cli.jar" >> $GITHUB_ENV
          echo "VERSION=0.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GH_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.GH_RELEASES_APP_PEM_CONTENT }}
          owner: medusa-software-hq
          repositories: counter-aws-releases,homebrew-tap

      - name: Create a release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${VERSION}" \
            --repo medusa-software-hq/counter-aws-releases \
            --title "Counter CLI ${VERSION}" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            "${JAR}"

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Update Homebrew formula
        working-directory: cli/tools/update-formula
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run update_formula.py --version "${VERSION}" --jar "${JAR}"
