name: Publish CLI

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "cli/**"

  workflow_dispatch:

permissions:
  contents: read

# Two runs would race to create the release and rewrite the Homebrew formula.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JAVA_VERSION: 21

jobs:
  # Each deployed environment's Cognito config is a per-environment Actions variable, and a job can
  # only join one environment — so a small job per environment surfaces its (public) values as outputs
  # for the env-agnostic publish job below, which bakes both into the one jar.
  read-prod-config:
    name: Read prod config
    runs-on: ubuntu-latest
    environment: production
    outputs:
      cognito-issuer: ${{ steps.read.outputs.cognito-issuer }}
      cognito-client-id: ${{ steps.read.outputs.cognito-client-id }}
    steps:
      - name: Read prod Cognito config
        id: read
        env:
          ISSUER: ${{ vars.COGNITO_ISSUER_URL }}
          CLIENT_ID: ${{ vars.COGNITO_CLI_CLIENT_ID }}
        run: |
          {
            echo "cognito-issuer=$ISSUER"
            echo "cognito-client-id=$CLIENT_ID"
          } >> "$GITHUB_OUTPUT"

  read-staging-config:
    name: Read staging config
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      cognito-issuer: ${{ steps.read.outputs.cognito-issuer }}
      cognito-client-id: ${{ steps.read.outputs.cognito-client-id }}
    steps:
      - name: Read staging Cognito config
        id: read
        env:
          ISSUER: ${{ vars.COGNITO_ISSUER_URL }}
          CLIENT_ID: ${{ vars.COGNITO_CLI_CLIENT_ID }}
        run: |
          {
            echo "cognito-issuer=$ISSUER"
            echo "cognito-client-id=$CLIENT_ID"
          } >> "$GITHUB_OUTPUT"

  publish-cli:
    name: Publish CLI fat jar
    needs: [read-prod-config, read-staging-config]
    runs-on: ubuntu-latest
    # No `environment:` — publishing is cross-environment. Each environment's Cognito config comes from
    # the read-*-config jobs above; the releaser app id (repo variable) + key (repo secret) are
    # repo-level, so no environment is needed to reach them.

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat jar
        working-directory: cli
        # Bake each environment's Cognito issuer + CLI client id (public values — no secret) into the
        # one jar, so `login` works for both prod and staging. The API host is not baked here: it's
        # author-derived and read from the committed config.json.
        env:
          COGNITO_ISSUER_URL_PROD: ${{ needs.read-prod-config.outputs.cognito-issuer }}
          COGNITO_CLI_CLIENT_ID_PROD: ${{ needs.read-prod-config.outputs.cognito-client-id }}
          COGNITO_ISSUER_URL_STAGING: ${{ needs.read-staging-config.outputs.cognito-issuer }}
          COGNITO_CLI_CLIENT_ID_STAGING: ${{ needs.read-staging-config.outputs.cognito-client-id }}
        run: |
          ../gradlew :cli:shadowJar
          echo "JAR=$GITHUB_WORKSPACE/cli/build/libs/counter-cli.jar" >> $GITHUB_ENV
          echo "VERSION=0.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GH_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.GH_RELEASES_APP_PEM_CONTENT }}
          owner: medusa-software-hq
          repositories: counter-aws-releases,homebrew-tap

      - name: Create a release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${VERSION}" \
            --repo medusa-software-hq/counter-aws-releases \
            --title "Counter CLI ${VERSION}" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            "${JAR}"

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Update Homebrew formula
        working-directory: cli/tools/update-formula
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run update_formula.py --version "${VERSION}" --jar "${JAR}"
