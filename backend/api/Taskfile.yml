version: '3'

.kotlinSources: &kotlinSources
  - '**/*.kt'
  - '**/*.kts'

tasks:
  fmt:check:
    desc: Check Kotlin formatting
    sources: *kotlinSources
    cmds:
      - ../../gradlew ktfmtCheck
    interactive: true

  fmt:fix:
    desc: Fix Kotlin formatting
    sources: *kotlinSources
    cmds:
      - ../../gradlew ktfmtFormat
    interactive: true

  lint:
    desc: Lint the Kotlin sources
    sources: *kotlinSources
    cmds:
      - ../../gradlew detekt
    interactive: true

  build:
    desc: Compile the Kotlin sources
    sources: *kotlinSources
    cmds:
      - ../../gradlew compileKotlin
    interactive: true

  native-zip:
    desc: Build the GraalVM-native custom-runtime zip (the deploy artifact)
    cmds:
      - ../../gradlew :backend:api:handler:buildNativeLambda
    interactive: true
